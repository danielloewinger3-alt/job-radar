name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the local dev / runtime interpreter (3.13.x). CI failures then
          # reflect real breakage, not version skew.
          python-version: "3.13"

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`, so this is the
        # only install step needed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest
